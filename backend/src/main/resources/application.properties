spring.application.name=audiblex-api
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/audiblex?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:whisper-1}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
